name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0.84.4 is fullsend's sandbox image pin (images/sandbox/Containerfile ARG PI_VERSION);
        # 0.85.0 is the latest pi release. This matrix is the compatibility check: the extension
        # mirrors no pi internals, so a pi release can only break it through the public
        # `anthropicMessagesApi()` / `createProvider` / `getModels` surface — which is exactly
        # what the tests exercise. Bump the newer entry when pi releases; move the older one
        # when fullsend moves its pin.
        pi: ["0.84.4", "0.85.0"]
    name: ci (pi ${{ matrix.pi }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      # Peers (pi itself) are installed here on purpose: `tsc` and the tests need pi's types.
      # Consumers must install with --omit=peer so the running pi is never shadowed by a second
      # copy of @earendil-works/* — see README, "Installing as a consumer".
      - run: npm ci
      - run: npm install --no-save --ignore-scripts @earendil-works/pi-ai@${{ matrix.pi }} @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - run: npm run ci
