name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0.87.1 is both fullsend's sandbox image pin (images/sandbox/Containerfile ARG PI_VERSION)
        # and the latest pi release. This matrix is the compatibility check: the extension
        # mirrors no pi internals, so a pi release can only break it through the public
        # `anthropicMessagesApi()` / `createProvider` / `getModels` surface — which is exactly
        # what the tests exercise. Bump the newer entry when pi releases; move the older one
        # when fullsend moves its pin.
        pi: ["0.87.1"]
    name: ci (pi ${{ matrix.pi }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      # Peers (pi itself) are installed here on purpose: `tsc` and the tests need pi's types.
      # Consumers must install with --omit=peer so the running pi is never shadowed by a second
      # copy of @earendil-works/* — see README, "Installing as a consumer".
      - run: npm ci
      - run: npm install --no-save --ignore-scripts @earendil-works/pi-ai@${{ matrix.pi }} @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - run: npm run ci

  # One stable context for the branch ruleset to require: the matrix job names carry the pi
  # version and change on every bump, so the ruleset points here instead.
  ci:
    needs: matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All matrix legs passed
        env:
          RESULT: ${{ needs.matrix.result }}
        run: |
          echo "matrix result: $RESULT"
          [ "$RESULT" = "success" ]
